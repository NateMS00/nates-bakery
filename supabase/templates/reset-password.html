<h2>Reset your Backery password</h2>
<p>Follow this link to set a new password. It works once, for one hour.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery">Set a new password</a></p>
<p>If you didn't ask for this, you can ignore this email; your password stays the same.</p>
